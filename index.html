<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLS DONATE - Donators</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
        text-align: center;
    }

    header {
        padding: 20px;
        font-size: 32px;
        font-weight: bold;
        letter-spacing: 2px;
        background: white;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .container {
        padding: 40px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
    }

    .card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        width: 230px;
        border: 4px solid #00ff66;
        box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        transition: all 0.3s ease;
        position: relative;
    }

    /* Flashing green effect */
    @keyframes glow {
        0% { box-shadow: 0 0 10px #00ff66; }
        50% { box-shadow: 0 0 25px #00ff66; }
        100% { box-shadow: 0 0 10px #00ff66; }
    }

    .card:hover {
        background: #00ff66;
        color: black;
        animation: glow 1s infinite;
        transform: scale(1.05);
    }

    .avatar {
        width: 75px;
        height: 75px;
        border-radius: 50%;
        margin-bottom: 10px;
        object-fit: cover;
        border: 3px solid #00ff66;
    }

    .name {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .amount {
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .robux-icon {
        width: 20px;
        height: 20px;
    }

    footer {
        margin-top: 30px;
        padding: 15px;
        background: white;
        font-size: 14px;
        box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
    }
</style>
</head>

<body>

<header>PLS DONATE - TOP DONATORS</header>

<div class="container" id="donatorContainer"></div>

<footer>Made with gratitude 💚</footer>

<script>
    const donators = [
        { name: "Me", amount: 0, avatar: "example.png" }
    ];

    const container = document.getElementById("donatorContainer");

    donators.forEach(donator => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="${donator.avatar}" class="avatar">
            <div class="name">${donator.name}</div>
            <div class="amount">
                <img src="robux.png" class="robux-icon">
                ${donator.amount} Robux
            </div>
        `;

        container.appendChild(card);
    });
</script>

</body>
</html>
