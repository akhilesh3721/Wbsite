<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TREASURE DONATORS</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #2b1a12;
    color: white;
}

/* MAIN CONTAINER */
.wrapper {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
    align-items: center;
    padding: 40px;
}

/* LEFT SIDE TEXT */
.left-section {
    max-width: 400px;
}

.title {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

.description {
    font-size: 18px;
    line-height: 1.6;
}

/* RIGHT SIDE LEADERBOARD BOARD */
.board {
    background: linear-gradient(#d49a4f, #b87428);
    border: 8px solid #8a4f16;
    border-radius: 20px;
    width: 320px;
    padding: 20px;
    box-shadow: 0 10px 0 #5a2f0c;
}

.board h2 {
    margin-top: 0;
    margin-bottom: 20px;
}

.leader {
    background: rgba(255,255,255,0.15);
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    font-weight: bold;
}

/* GOLD STYLE FOR TOP DONOR */
.top-donor {
    background: gold;
    color: black;
}

footer {
    margin-top: 40px;
    text-align: center;
    padding: 20px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="left-section">
        <div class="title">🏴‍☠️ TUPAC'S TREASURE</div>
        <div class="description">
            Donate and earn your spot on the leaderboard! <br><br>
            The higher you donate, the higher your name rises.
            <br><br>
            Treasure favors the bold 💰
        </div>
    </div>

    <div class="board">
        <h2>🏆 TOP DONATORS</h2>
        <div id="leaderboard"></div>
    </div>

</div>

<footer>
    Username: akhil3721 | NAME: AKHILTHESUS
</footer>

<script>
const donators = [
    { name: "xyxn", amount: 10 },
    { name: "chin", amount: 2 },
    { name: "akhil3721", amount: 1200 },
    { name: "MegaRich", amount: 500 }
];

// Sort highest first
donators.sort((a, b) => b.amount - a.amount);

const leaderboard = document.getElementById("leaderboard");

async function getUserId(username) {
    const response = await fetch("https://users.roblox.com/v1/usernames/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            usernames: [username],
            excludeBannedUsers: false
        })
    });

    const data = await response.json();
    return data.data[0]?.id;
}

async function createLeaderboard() {
    for (let i = 0; i < donators.length; i++) {

        const donator = donators[i];
        const userId = await getUserId(donator.name);

        const avatarUrl = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=100x100&format=Png&isCircular=true`;

        const row = document.createElement("div");
        row.className = "leader";

        if (i === 0) {
            row.classList.add("top-donor");
        }

        row.innerHTML = `
            <div style="display:flex; align-items:center; gap:10px;">
                <img src="${avatarUrl}" style="width:40px; height:40px; border-radius:50%;">
                <span>${i + 1}. ${donator.name}</span>
            </div>
            <span>${donator.amount} Robux</span>
        `;

        leaderboard.appendChild(row);
    }
}

createLeaderboard();
</script>

</body>
</html>
